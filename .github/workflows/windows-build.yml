name: Build Windows (unsigned)

# 手动触发：Actions → Build Windows (unsigned) → Run workflow
# 产物：rd_client-windows-x64-unsigned（zip）
#   含 RDClient.exe / rd_client.dll / service.exe / Flutter 依赖
# 不签名、不出 MSI；签名见 WINDOWS-BUILD.md 第 8 节

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (repo 要求 3.24.5)"
        default: "3.24.5"
        required: false
      rust_toolchain:
        description: "Rust toolchain (stable 或 1.81)"
        default: "1.81"
        required: false

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version }}
  RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
  VCPKG_TRIPLET: x64-windows-static
  # 与上游 CI 一致，vcpkg.json 的 baseline 依赖这个 commit
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule
        shell: pwsh
        run: |
          git submodule status
          if (-not (Test-Path "libs/hbb_common/src/config.rs")) {
            Write-Error "libs/hbb_common 未初始化，检查 .gitmodules"
          }

      # ---------- Rust ----------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # codegen 会用 rustfmt 格式化生成的 Rust 代码，缺了会 Fatal error
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: win-x64-${{ env.RUST_TOOLCHAIN }}
          cache-targets: true

      # ---------- vcpkg（manifest 模式，依赖来自仓库根的 vcpkg.json） ----------
      # 顺序不能换：先 clone+bootstrap（保证 vcpkg.exe 一定存在），再恢复缓存。
      # 之前按 cache-hit 跳过 clone，缓存命中时 C:\vcpkg\vcpkg.exe 根本不存在。
      - name: Clone and bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            Push-Location C:\vcpkg
            git checkout ${{ env.VCPKG_COMMIT_ID }}
            .\bootstrap-vcpkg.bat
            Pop-Location
          }
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\buildtrees
            C:\vcpkg\packages
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-manifest-v4

      # chromium.googlesource.com 在 GitHub runner 上 git fetch 常以 exit 128 中断
      # （v6 就挂在 libyuv 的 git-fetch）。关 HTTP/2、放宽低速中断阈值。
      # libyuv 已改走 lemenkov/libyuv 镜像；aom 没有含 3.14.1 的 GitHub 镜像，
      # 只能靠这层加固 + 下面的 install 重试。
      - name: Harden git for large fetches
        shell: pwsh
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          # 低速 60 秒即中断，避免连接被黑洞时永久挂起
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          # 仓库 404/需认证时 git 会等凭据输入；无 TTY 就挂死，必须禁交互
          git config --global credential.interactive false
          echo "GIT_TERMINAL_PROMPT=0" >> $env:GITHUB_ENV
          echo "GCM_INTERACTIVE=Never" >> $env:GITHUB_ENV
          git config --list --global | Select-String 'http\.'

      # vcpkg.json 在仓库根，必须用 manifest 模式（不能逐个指定包名）
      # 缓存命中也要跑：install 对已装包幂等，还能补齐缓存缺的包。
      - name: vcpkg install (manifest)
        shell: pwsh
        timeout-minutes: 120
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ env.VCPKG_TRIPLET }}
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== vcpkg install 第 $i 次尝试 ==="
            C:\vcpkg\vcpkg.exe install `
              --triplet ${{ env.VCPKG_TRIPLET }} `
              --x-install-root="C:\vcpkg\installed"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "第 $i 次失败（exit=$LASTEXITCODE）"
            if ($i -lt 3) { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) {
            Write-Host "=== 失败日志（*err.log 优先）==="
            $sum = $env:GITHUB_STEP_SUMMARY
            $logs = Get-ChildItem C:\vcpkg\buildtrees -Recurse `
              -Filter *err.log -ErrorAction SilentlyContinue |
              Select-Object -First 8
            foreach ($l in $logs) {
              Write-Host "--- $($l.FullName) ---"
              Get-Content $l.FullName -Tail 40
              # 同时写进 step summary，网页上不用下载就能看
              Add-Content -Path $sum -Value "### $($l.Name)"
              Add-Content -Path $sum -Value '```'
              Get-Content $l.FullName -Tail 40 | Add-Content -Path $sum
              Add-Content -Path $sum -Value '```'
            }
            Write-Error "vcpkg install 失败（已重试 3 次）"
          }
          C:\vcpkg\vcpkg.exe integrate install

      # Windows 静态库后缀是 .lib，且库名是 CMake target 名：
      # libvpx -> vpx.lib, libyuv -> yuv.lib, libjpeg-turbo -> jpeg.lib
      - name: Verify vcpkg libs
        shell: pwsh
        run: |
          Write-Host "workflow-rev: 2026-10-21-v8"
          Write-Host "v8: lemenkov/libyuv, no git prompt, fast fail"
          $lib = "C:\vcpkg\installed\${{ env.VCPKG_TRIPLET }}\lib"
          if (-not (Test-Path $lib)) {
            Write-Host "=== installed 目录 ==="
            $dirs = Get-ChildItem C:\vcpkg\installed -Directory `
              -ErrorAction SilentlyContinue
            $dirs | Select-Object -ExpandProperty Name
            Write-Error "库目录不存在: $lib"
          }
          $files = Get-ChildItem $lib -Filter *.lib `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          $joined = $files -join ', '
          Write-Host "已安装库 ($($files.Count) 个): $joined"
          foreach ($n in @("vpx.lib", "yuv.lib", "opus.lib", "aom.lib")) {
            if ($files -notcontains $n) {
              Write-Error "缺少 $n（vcpkg 依赖不完整）"
            }
          }
          Write-Host "vcpkg 依赖校验通过：$lib"

      # ---------- Flutter ----------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      # ---------- bridge 代码生成（仓库无此文件） ----------
      - name: Install codegen tools
        shell: pwsh
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen `
            --version 1.80.1 --features uuid --locked

      - name: flutter pub get
        shell: pwsh
        run: |
          cd flutter
          flutter pub get

      - name: Generate bridge
        shell: pwsh
        run: |
          # 双保险：确保 rustfmt 可用（codegen 内部会调用它）
          rustup component add rustfmt
          rustfmt --version

          flutter_rust_bridge_codegen `
            --rust-input ./src/flutter_ffi.rs `
            --dart-output ./flutter/lib/generated_bridge.dart `
            --c-output ./flutter/macos/Runner/bridge_generated.h

          $h = "flutter\macos\Runner\bridge_generated.h"
          if (-not (Test-Path $h)) {
            Write-Host "=== codegen 产物检查 ==="
            $gen = Get-ChildItem src -Filter "bridge_generated*" `
              -ErrorAction SilentlyContinue
            $gen | Select-Object Name
            Get-ChildItem flutter\lib -Filter "generated_bridge*" `
              -ErrorAction SilentlyContinue | Select-Object Name
            Write-Error "bridge_generated.h 未生成"
          }
          Copy-Item $h flutter\ios\Runner\bridge_generated.h -Force
          if (-not (Test-Path "src/bridge_generated.rs")) {
            Write-Error "bridge_generated.rs 生成失败"
          }

      - name: build_runner
        shell: pwsh
        run: |
          cd flutter
          flutter pub run build_runner build `
            --delete-conflicting-outputs

      # ---------- 编译 ----------
      - name: cargo build (flutter feature)
        shell: pwsh
        run: cargo build --locked --features flutter --release

      - name: flutter build windows
        shell: pwsh
        run: |
          cd flutter
          flutter build windows --release

      # ---------- 组装 ----------
      - name: Assemble artifact
        shell: pwsh
        run: |
          $rel = "flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path $rel)) {
            Write-Error "未找到 Flutter 产物目录: $rel"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Flutter runner 的 exe 名取自 CMake BINARY_NAME（rd_client.exe），
          # 对外统一为 RDClient.exe（APP_NAME 与 {app_name}.exe 依赖此名）
          Copy-Item "$rel\*" dist -Recurse -Force
          if (Test-Path "dist\rd_client.exe") {
            Move-Item dist\rd_client.exe dist\RDClient.exe -Force
          }

          Copy-Item target\release\service.exe dist `
            -Force -ErrorAction SilentlyContinue
          Copy-Item target\release\rd_client.dll dist `
            -Force -ErrorAction SilentlyContinue

          Get-ChildItem dist |
            Select-Object Name, Length |
            Format-Table -AutoSize

          # 静态特征自检（白名单：驱动名与 rustdesk.com 文档链接）
          $hit = Select-String -Path dist\*.exe, dist\*.dll `
            -Pattern "rustdesk" -SimpleMatch -List
          if ($hit) {
            Write-Warning "含 rustdesk 字样，需人工确认为白名单:"
            $hit | ForEach-Object { Write-Warning $_.Path }
          } else {
            Write-Host "strings 自检：未发现 rustdesk"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd_client-windows-x64-unsigned
          path: dist
          if-no-files-found: error
          retention-days: 14
